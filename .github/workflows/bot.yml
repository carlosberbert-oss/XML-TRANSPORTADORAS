name: Bot XML Transportadoras

on:
  # Disparado pelo cron-job.org nos horários configurados
  workflow_dispatch:
    inputs:
      transportadora:
        description: 'Qual transportadora rodar?'
        required: true
        default: 'JAMEF'
        type: choice
        options:
          - JAMEF
          - FITLOG TRANSPORTES
          - MIRA TRANSPORTES

permissions:
  contents: write

jobs:
  rodar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar dependências do sistema
        run: |
          # Remove QUALQUER fonte apt que aponte pro Google Chrome —
          # o nome/formato do arquivo varia entre versões do runner.
          # Não usamos o Chrome (usamos o Chromium do Playwright).
          sudo rm -f /etc/apt/sources.list.d/*google*
          sudo grep -rl "dl.google.com" /etc/apt/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          # Lista com nomes corretos pro Ubuntu 24.04 (noble / transição t64).
          # NÃO usar "playwright install --with-deps": o Playwright 1.44
          # ainda pede "libasound2", que não existe mais no noble.
          sudo apt-get install -y \
            libasound2t64 libgbm1 libnss3 libxss1 libxtst6 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libpango-1.0-0 libcairo2

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install chromium

      - name: Rodar o bot
        env:
          SISTEMA_EMAIL: ${{ secrets.SISTEMA_EMAIL }}
          SISTEMA_SENHA: ${{ secrets.SISTEMA_SENHA }}
          TRANSPORTADORA: ${{ github.event.inputs.transportadora }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_OAUTH_TOKEN: ${{ secrets.GMAIL_OAUTH_TOKEN }}
          JAMEF_EMAIL: ${{ secrets.JAMEF_EMAIL }}
          JAMEF_SENHA: ${{ secrets.JAMEF_SENHA }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CI: "true"
        run: python bot.py

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Commitar histórico atualizado
        if: always()
        run: |
          git config --local user.email "bot@zebrands.mx"
          git config --local user.name "Bot XML Transportadoras"
          git add historico_processados.json
          git diff --staged --quiet || git commit -m "🤖 Histórico atualizado"
          git push
